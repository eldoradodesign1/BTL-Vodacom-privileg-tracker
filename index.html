<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-refined.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#6b0710" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BTL Tracker" />
    <title>BEYOND THE LINE Deployment tracker - by Eldo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        // Si le bundle ne monte pas, proposer une récupération sans toucher aux données métier.
        window.setTimeout(() => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          const notice = document.createElement('div');
          notice.setAttribute('role', 'alert');
          notice.style.cssText = 'position:fixed;z-index:9999;inset:20% 12px auto;border:1px solid #fb7185;border-radius:18px;padding:22px;background:#17151d;color:white;font:14px/1.5 sans-serif;text-align:center;box-shadow:0 12px 30px #0007';
          const heading = document.createElement('strong');
          heading.textContent = 'Impossible de charger l’interface';
          const detail = document.createElement('p');
          detail.textContent = 'Le réseau ou une ancienne version en cache peut bloquer le démarrage. Tes données locales restent conservées.';
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Rafraîchir l’application';
          button.style.cssText = 'margin-top:10px;padding:13px 20px;border:0;border-radius:12px;background:#fb7185;color:#181015;font-weight:800;cursor:pointer';
          button.addEventListener('click', async () => {
            button.disabled = true;
            button.textContent = 'Actualisation…';
            try {
              if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.filter((name) => name.startsWith('btl-tracker-')).map((name) => caches.delete(name)));
              }
              if ('serviceWorker' in navigator) {
                const reg = await navigator.serviceWorker.getRegistration();
                if (reg) await reg.update();
              }
            } catch (_) { /* Une absence de cache ne doit jamais bloquer l'actualisation. */ }
            const target = new URL(window.location.href);
            target.searchParams.set('btl_recovery', String(Date.now()));
            window.location.replace(target.href);
          });
          notice.append(heading, detail, button);
          root.append(notice);
        }, 10000);
      })();
    </script>
    <script>
      (() => {
        const USERS_KEY = 'vodacom_users_v6';
        const CURRENT_USER_KEY = 'vodacom_user';
        const seedUsers = [
          {
            id: 'adm-0001-4a11-a881-100000000001',
            phone: '0816701000',
            name: 'Bradley Izamaboko',
            role: 'admin',
            password: 'admin',
            permanentShopId: 'S001'
          },
          {
            id: '0a6a2520-96bb-474d-87b6-b0eb8fc46cd6',
            phone: '0896332431',
            name: 'Eldo Bitulu',
            role: 'admin',
            password: 'admin',
            permanentShopId: 'S001'
          },
          {
            id: 'sup-0001-4a11-a881-100000000001',
            phone: '0812923941',
            name: 'Hervé Ntalu',
            role: 'supervisor',
            password: 'test',
            permanentShopId: 'S001'
          }
        ];

        const normalizePhone = (value) => {
          if (!value) return '';
          let clean = String(value).replace(/\D/g, '');
          if (clean.startsWith('243')) clean = '0' + clean.substring(3);
          if (clean.length === 9 && !clean.startsWith('0')) clean = '0' + clean;
          return clean;
        };

        const ensureUsers = () => {
          try {
            const raw = localStorage.getItem(USERS_KEY);
            let users = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(users)) users = [];

            seedUsers.forEach((seed) => {
              const existing = users.find((u) => normalizePhone(u.phone) === normalizePhone(seed.phone) || u.id === seed.id);
              if (!existing) {
                users.push({ ...seed });
              } else if (!existing.password && seed.password) {
                existing.password = seed.password;
              }
            });

            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            return users;
          } catch (error) {
            console.warn('Login fallback init failed', error);
            return [];
          }
        };

        const findUser = (phoneInput) => {
          const users = ensureUsers();
          const target = normalizePhone(phoneInput);
          const raw = String(phoneInput || '').trim().toLowerCase().replace(/[\s\-\.\+]/g, '');
          return users.find((u) => {
            const uPhone = normalizePhone(u.phone);
            const uRaw = String(u.phone || '').trim().toLowerCase().replace(/[\s\-\.\+]/g, '');
            const uId = String(u.id || '').trim().toLowerCase().replace(/[\s\-\.\+]/g, '');
            return (target && uPhone === target) || (raw && uRaw === raw) || (raw && uId === raw);
          });
        };

        let loginOverrideAttempts = 0;
        const installLoginOverride = () => {
          // Les agents connectés ne doivent pas rechercher un formulaire indéfiniment.
          try { if (localStorage.getItem(CURRENT_USER_KEY)) return; } catch (_) {}
          const form = document.querySelector('form');
          if (!form) {
            if (++loginOverrideAttempts < 40) setTimeout(installLoginOverride, 200);
            return;
          }

          form.addEventListener('submit', (event) => {
            const phoneInput = form.querySelector('input[type="text"], input:not([type])');
            const phone = phoneInput ? phoneInput.value : '';
            const user = findUser(phone);
            if (user) {
              event.preventDefault();
              localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
              window.location.reload();
            }
          }, true);
        };

        ensureUsers();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', installLoginOverride, { once: true });
        } else {
          installLoginOverride();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
